<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share News Assembler</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h2>Views</h2>
            <a class="nav-item active" data-view="personal" onclick="switchView('personal')">
                <span class="nav-icon">&#128100;</span>
                Personal
            </a>
            <a class="nav-item" data-view="stock" onclick="switchView('stock')">
                <span class="nav-icon">&#128200;</span>
                Per-Stock
            </a>
            <a class="nav-item" data-view="market" onclick="switchView('market')">
                <span class="nav-icon">&#127758;</span>
                Market
            </a>

            <div class="holdings-section">
                <h3>Your Holdings</h3>
                <div id="holdingsList"></div>
                <div class="stock-search">
                    <input type="text" id="stockSearch" placeholder="Add ticker..." oninput="searchTickers(this.value)">
                    <div id="searchResults" class="search-results" style="display:none"></div>
                </div>
            </div>
        </aside>

        <main class="main">
            <div class="header">
                <h1 id="viewTitle">Personal News</h1>
                <div class="controls">
                    <select id="ageFilter" onchange="loadNews()">
                        <option value="all">All Time</option>
                        <option value="24h">Last 24h</option>
                        <option value="7d">Last 7 Days</option>
                    </select>
                    <select id="stockSelect" style="display:none" onchange="loadNews()">
                        <option value="">Select stock...</option>
                    </select>
                    <button class="btn btn-secondary" onclick="triggerIngest()">Refresh Feeds</button>
                </div>
            </div>
            <div id="newsContainer" class="news-list">
                <div class="loading">Loading news...</div>
            </div>
            <div id="pagination" class="pagination"></div>
        </main>
    </div>
    <div class="keyboard-hint">
        <kbd>1</kbd> Personal <kbd>2</kbd> Stock <kbd>3</kbd> Market <kbd>R</kbd> Refresh
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
